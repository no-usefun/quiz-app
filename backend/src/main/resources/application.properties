spring.application.name=backend
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.auth.oauth2-enabled=false
app.auth.email-verification-required=false
app.auth.email-features-enabled=true
app.exam.mode=ONLINE
app.exam.time-zone=${EXAM_TIME_ZONE:Asia/Kolkata}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
