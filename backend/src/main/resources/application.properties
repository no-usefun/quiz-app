spring.application.name=backend
app.frontend-url=${FRONTEND_URL}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.auth.oauth2-enabled=false
app.auth.email-verification-required=false
app.auth.email-features-enabled=true
app.exam.mode=ONLINE
app.exam.time-zone=${EXAM_TIME_ZONE}
server.address=${SERVER_ADDRESS}
server.port=${PORT}

# Separate Python AI proctoring service (frontend still streams frames directly to this service).
app.ai-proctoring.base-url=${AI_PROCTORING_BASE_URL}