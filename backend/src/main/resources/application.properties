# Load the repository-level or backend-level .env when running locally.
# Spring Boot does not load a plain .env file by default.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=backend
app.frontend-url=${FRONTEND_URL:}
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:online_quiz_exam}?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.oauth2-enabled=true
app.auth.email-verification-required=false
app.auth.email-features-enabled=true
app.exam.mode=ONLINE
app.exam.time-zone=${EXAM_TIME_ZONE:Asia/Kolkata}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}

# Separate Python AI proctoring service (frontend still streams frames directly to this service).
app.ai-proctoring.base-url=${AI_PROCTORING_BASE_URL:http://localhost:8000}

# Google OAuth2 / OpenID Connect
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in the runtime environment for the online profile.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
