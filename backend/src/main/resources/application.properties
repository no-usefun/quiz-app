spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local-exam}

spring.application.name=backend
app.frontend-url=${FRONTEND_URL:}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:online_quiz_exam}?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.exam.time-zone=${EXAM_TIME_ZONE:Asia/Kolkata}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}

app.ai-proctoring.base-url=${AI_PROCTORING_BASE_URL:http://localhost:8000}