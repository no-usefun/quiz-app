# LAN-only exam profile. No Internet-dependent authentication providers are configured here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:online_quiz_exam}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.auth.oauth2-enabled=false
app.auth.email-verification-required=false
app.auth.email-features-enabled=false
app.exam.mode=LOCAL_EXAM
app.exam.time-zone=${EXAM_TIME_ZONE:UTC}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
