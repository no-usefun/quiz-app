# LAN-only exam profile. No Internet-dependent authentication providers are configured here.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.auth.oauth2-enabled=false
app.auth.email-verification-required=false
app.auth.email-features-enabled=false
app.exam.mode=LOCAL_EXAM
app.exam.time-zone=${EXAM_TIME_ZONE}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

server.address=${SERVER_ADDRESS}
server.port=${PORT}
