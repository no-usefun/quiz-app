<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#165dfb" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <polygon points="64,10 118,28 118,74 64,118 10,74 10,28" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Cyber Grid Accent -->
  <path d="M 64,22 L 106,36 L 106,70 L 64,106 L 22,70 L 22,36 Z" fill="none" stroke="#165dfb" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3,3" />

  <!-- Central Optical Eye -->
  <ellipse cx="64" cy="60" rx="34" ry="18" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glow)" />
  
  <!-- Iris -->
  <circle cx="64" cy="60" r="13" fill="url(#eyeGrad)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Pupil -->
  <circle cx="64" cy="60" r="6" fill="#0f172a" />
  
  <!-- Eye Glint Reflection -->
  <circle cx="67" cy="57" r="2.5" fill="#ffffff" />
</svg>
